services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_journal"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://trading:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/trading_journal?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://trading:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/trading_journal?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:-}
      AUTH_CLIENT_IP_HEADER: ${AUTH_CLIENT_IP_HEADER:-x-forwarded-for}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-backups:
